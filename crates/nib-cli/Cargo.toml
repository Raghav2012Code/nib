[package]
name = "nib-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nib"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
clap = { version = "4.6.10", features = ["derive"] }
crossterm = "0.29.0"
nib-core = { path = "../nib-core" }
ratatui = "0.29"
tui-textarea = "0.7"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
